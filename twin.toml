name = "tesla-roadster-runner"
description = "October 2026 Tesla Roadster engineering study: Performance, Thrust and Rocket"
version = "0.1.0"

[usd]
default_scene = "scenes/roadster_cinematic.usda"
scenes = [
    "scenes/roadster_cinematic.usda",
    "scenes/roadster_skill_course.usda",
    "scenes/roadster_ramp.usda",
    "scenes/tests/*.usda",
]

[sysml]
root = "requirements/roadster.sysml"
paths = ["requirements"]

[verification]
[[verification.cases]]
name = "Roadster::VerifyRunner"
scene = "scenes/tests/roadster_launch.usda"
script = "scenarios/tests/launch.rhai"
verdict_channel = "ROADSTER_RUNNER"

[[verification.cases]]
name = "Roadster::VerifySkillCourse"
scene = "scenes/tests/roadster_course_check.usda"
script = "scenarios/tests/course_pilot.rhai"
verdict_channel = "ROADSTER_COURSE"

[[components]]
name = "roadster.vehicle"
requirements = "requirements/roadster.sysml"
verification = "Roadster::VerifyRunner"
usd_path = "/World/Roadster"

[settings]
"usd.runtime_persistence" = false
