kind = "lunco.policy.v1"
scope = "twin"

[startup]
source = "startup.rhai"
entry = "install_policies"

[[policies]]
hook = "runtime.ui.properties"
source = "roadster_ui.rhai"
entry = "roadster_ui"
deterministic = false
required = false

[[policies]]
hook = "workbench.perspectives.twin"
source = "report_views.rhai"
entry = "assemble"
deterministic = false
required = false
skip_when_hook_unavailable = true

[[policies]]
hook = "camera.follow"
source = "roadster_camera.rhai"
entry = "follow_camera"
deterministic = false
required = false
